name: Backtest des signaux
on:
  workflow_dispatch:
    inputs:
      script:
        description: script à lancer
        default: backtest.mjs
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node "scripts/$SCRIPT"
        env:
          SCRIPT: ${{ inputs.script || 'backtest.mjs' }}
