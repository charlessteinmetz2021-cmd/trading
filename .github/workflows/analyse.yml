name: Analyse complète
on:
  workflow_dispatch:
    inputs:
      symbole:
        default: "EURUSD=X"
permissions:
  contents: read
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/analyse.mjs "$SYM"
        env:
          SYM: ${{ inputs.symbole }}
