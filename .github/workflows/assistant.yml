name: Assistant de trading

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer une notification de test"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: assistant
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock @anthropic-ai/sdk@1.4.0
      - name: Analyse des marchés
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIF: ${{ inputs.test }}
        run: node scripts/assistant.mjs
      - name: Enregistre les propositions
        run: |
          git config user.name "assistant-trading"
          git config user.email "assistant-trading@users.noreply.github.com"
          git add proposals.json assistant-state.json server-account.json
          if git diff --cached --quiet; then echo "rien de nouveau"; exit 0; fi
          git commit -m "Assistant : nouvelles propositions"
          git pull --rebase origin main && git push origin main
