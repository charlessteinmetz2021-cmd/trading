name: Assistant de trading

# Le serveur reste allumé environ 5 h 30 (il lit tes boutons toutes les 20 secondes),
# puis relance lui-même la suite. Le cron sert seulement de secours si la chaîne s'arrête.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer une notification de test"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ inputs.test && 'assistant-test' || 'assistant' }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock @anthropic-ai/sdk@1.4.0
      - name: Assistant (boucle)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIF: ${{ inputs.test }}
          LOOP_MINUTES: ${{ inputs.test && '0' || '330' }}
        run: |
          git config user.name "assistant-trading"
          git config user.email "assistant-trading@users.noreply.github.com"
          node scripts/assistant.mjs
      - name: Relance la suite
        if: ${{ !inputs.test && (success() || failure()) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run assistant.yml --repo ${{ github.repository }} --ref main
